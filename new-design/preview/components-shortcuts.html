<!doctype html>
<html lang="en"><head>
<meta charset="utf-8" />
<title>Shortcuts Panel · kbd</title>
<link rel="stylesheet" href="_base.css" />
<style>
  .card { padding: 0; background: #07575B; border: none; }
  .panel { width: 100%; background: var(--color-dark-800); color: var(--color-neutral-200); border-radius: var(--radius-lg); overflow: hidden; display:flex; flex-direction:column; }
  .panel__hdr {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; background: var(--color-dark-900);
    font-size: 13px; font-weight: 600;
  }
  .panel__body { padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; }
  .group__title {
    font-size: 11px; font-weight: 600; color: var(--color-neutral-400);
    text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 2px;
  }
  .row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 2px 0; font-size: 12px;
  }
  .desc { color: var(--color-neutral-300); }
  .keys { display: flex; align-items: center; gap: 2px; }
  .sep  { color: var(--color-neutral-500); font-size: 11px; padding: 0 2px; }
</style></head>
<body>
<div class="card">
  <div class="panel">
    <div class="panel__hdr">
      <span>Atajos de teclado</span>
      <button class="icon-btn" style="color:var(--color-neutral-400);width:20px;height:20px;font-size:12px">✕</button>
    </div>
    <div class="panel__body">
      <div>
        <h4 class="group__title">Modos</h4>
        <div class="row"><span class="desc">Modo Seleccionar</span><span class="keys"><span class="kbd">S</span></span></div>
        <div class="row"><span class="desc">Modo Insertar</span><span class="keys"><span class="kbd">I</span></span></div>
        <div class="row"><span class="desc">Modo Mover</span><span class="keys"><span class="kbd">M</span></span></div>
      </div>
      <div>
        <h4 class="group__title">Campos</h4>
        <div class="row"><span class="desc">Duplicar campo</span><span class="keys"><span class="kbd">Ctrl</span><span class="sep">+</span><span class="kbd">D</span></span></div>
        <div class="row"><span class="desc">Copiar campo(s)</span><span class="keys"><span class="kbd">Ctrl</span><span class="sep">+</span><span class="kbd">C</span></span></div>
        <div class="row"><span class="desc">Eliminar selección</span><span class="keys"><span class="kbd">Del</span></span></div>
      </div>
    </div>
  </div>
</div>
</body></html>
