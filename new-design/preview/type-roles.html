<!doctype html>
<html lang="en"><head>
<meta charset="utf-8" />
<title>Type Roles</title>
<link rel="stylesheet" href="_base.css" />
<style>
  .card { padding: 22px 26px; flex-direction: column; gap: 14px; }
  .role { display: grid; grid-template-columns: 130px 1fr; align-items: baseline; gap: 16px; }
  .role .tag-name { font-family: var(--font-family-mono); font-size: 11px; color: var(--fg-3); }
</style></head>
<body>
<div class="card">
  <div class="role"><span class="tag-name">.t-display</span><span class="t-display">Rellenar PDF</span></div>
  <div class="role"><span class="tag-name">.t-h1</span><span class="t-h1">Editor de plantilla</span></div>
  <div class="role"><span class="tag-name">.t-h2</span><span class="t-h2">Propiedades del campo</span></div>
  <div class="role"><span class="tag-name">.t-h3</span><span class="t-h3">Fields (3)</span></div>
  <div class="role"><span class="tag-name">.t-body</span><span class="t-body">Importa un PDF y añade campos de formulario interactivos.</span></div>
  <div class="role"><span class="tag-name">.t-label</span><span class="t-label">Tamaño de fuente (pt)</span></div>
  <div class="role"><span class="tag-name">.t-eyebrow</span><span class="t-eyebrow">Atajos de teclado</span></div>
  <div class="role"><span class="tag-name">.t-caption</span><span class="t-caption">Click on the PDF to add fields</span></div>
  <div class="role"><span class="tag-name">.t-code</span><span class="t-code">field-name__01 · 612 × 32 pt</span></div>
</div>
</body></html>
