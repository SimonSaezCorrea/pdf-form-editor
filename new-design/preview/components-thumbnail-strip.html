<!doctype html>
<html lang="en"><head>
<meta charset="utf-8" />
<title>Thumbnail Strip</title>
<link rel="stylesheet" href="_base.css" />
<style>
  .card { padding: 16px; background: var(--bg-panel); display: flex; gap: 12px; }
  .thumb {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 4px; border-radius: 4px;
    border: 2px solid transparent;
    background: none; cursor: pointer;
  }
  .thumb__page {
    width: 84px; height: 108px;
    background: #fff; border-radius: 2px;
    box-shadow: var(--shadow-sm);
    position: relative; overflow: hidden;
    border: 1px solid var(--border-color);
  }
  .thumb__page::before, .thumb__page::after {
    content: ""; position: absolute; left: 10px; right: 10px;
    height: 2px; background: #e5e7eb; border-radius: 2px;
  }
  .thumb__page::before { top: 14px; }
  .thumb__page::after { top: 24px; width: 30px; }
  .lines { position: absolute; left: 10px; right: 10px; }
  .lines span { display: block; height: 2px; background: #e5e7eb; border-radius: 2px; margin-bottom: 6px; }
  .lines span:nth-child(3) { width: 60%; }
  .placeholder {
    width: 84px; height: 108px; background: var(--bg-input);
    border: 1px solid var(--border-color); border-radius: 2px;
    display: flex; align-items: center; justify-content: center;
    color: var(--fg-3); font-size: 11px;
  }
  .thumb__label { font-size: 10px; color: var(--fg-3); }
  .thumb.active { border-color: var(--color-primary); background: rgba(102,165,173,0.08); }
</style></head>
<body>
<div class="card">
  <div class="thumb">
    <div class="thumb__page">
      <div class="lines" style="top:36px"><span></span><span></span><span></span><span></span></div>
    </div>
    <span class="thumb__label">1</span>
  </div>
  <div class="thumb active">
    <div class="thumb__page">
      <div class="lines" style="top:36px"><span></span><span></span><span></span><span></span></div>
    </div>
    <span class="thumb__label">2</span>
  </div>
  <div class="thumb">
    <div class="thumb__page">
      <div class="lines" style="top:36px"><span></span><span></span><span></span></div>
    </div>
    <span class="thumb__label">3</span>
  </div>
  <div class="thumb">
    <div class="placeholder">4</div>
    <span class="thumb__label">4</span>
  </div>
  <div class="thumb">
    <div class="placeholder">5</div>
    <span class="thumb__label">5</span>
  </div>
</div>
</body></html>
