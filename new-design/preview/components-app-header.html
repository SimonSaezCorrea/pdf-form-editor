<!doctype html>
<html lang="en"><head>
<meta charset="utf-8" />
<title>App Header</title>
<link rel="stylesheet" href="_base.css" />
<style>
  body { padding: 0; }
  .card { padding: 0; background: var(--bg-navbar); border: 1px solid var(--border-color); flex-direction: column; }
  .header-top {
    display: flex; align-items: center; gap: 12px;
    padding: 0 16px; height: 48px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    color: var(--color-navbar-text);
  }
  .header-top h1 { font-size: 14px; font-weight: 600; white-space: nowrap; }
  .mode-nav { display: flex; gap: 4px; margin-left: 12px; }
  .mode-btn { padding: 4px 12px; background: transparent; color: var(--color-navbar-text); border: 1px solid transparent; border-radius: 5px; font-size: 12px; opacity: .7; cursor: pointer; }
  .mode-btn.active { opacity: 1; background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.2); }
  .filename { font-size: 12px; color: var(--color-neutral-400); margin-left: 4px; }
  .actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .header-toolbar {
    display: grid; grid-template-columns: 1fr auto 1fr;
    padding: 0 16px; height: 48px; align-items: center;
  }
  .center { display: flex; align-items: center; gap: 8px; justify-content: center; }
  .end { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .mode-toolbar { display: flex; gap: 4px; }
  .mode-tb { padding: 4px 12px; background: transparent; color: var(--color-navbar-text); border: 1px solid transparent; border-radius: 4px; font-size: 11px; opacity: .7; cursor: pointer; }
  .mode-tb.active { opacity: 1; background: #F4A261; color: #2a1208; border-color:#F4A261; font-weight: 600; }
  .zoom-row { display: flex; align-items: center; gap: 4px; margin-left: 12px; }
  .zoom-label { color: var(--color-navbar-text); opacity:.75; font-size: 12px; min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; }
</style></head>
<body>
<div class="card">
  <div class="header-top">
    <h1>PDF Form Editor</h1>
    <nav class="mode-nav">
      <button class="mode-btn active">Editor de plantilla</button>
      <button class="mode-btn">Rellenar PDF</button>
    </nav>
    <span class="filename">contrato-arriendo.pdf</span>
    <div class="actions">
      <button class="btn btn--navbar btn--sm">Importar</button>
      <button class="btn btn--navbar btn--sm">Exportar</button>
      <button class="btn btn--primary btn--sm">Exportar PDF</button>
      <button class="icon-btn" style="color:var(--color-navbar-text)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </div>
  <div class="header-toolbar">
    <div></div>
    <div class="center">
      <div class="mode-toolbar">
        <button class="mode-tb">Seleccionar</button>
        <button class="mode-tb active">Insertar</button>
        <button class="mode-tb">Mover</button>
      </div>
      <div class="zoom-row">
        <button class="icon-btn" style="color:var(--color-navbar-text)">−</button>
        <span class="zoom-label">100%</span>
        <button class="icon-btn" style="color:var(--color-navbar-text)">+</button>
      </div>
    </div>
    <div class="end">
      <button class="btn btn--navbar btn--sm">Ocultar páginas</button>
    </div>
  </div>
</div>
</body></html>
