<!doctype html>
<html lang="en"><head>
<meta charset="utf-8" />
<title>Radii</title>
<link rel="stylesheet" href="_base.css" />
<style>
  .card { padding: 22px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; align-items: stretch; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; }
  .box { width: 64px; height: 64px; background: var(--bg-input); border: 1px solid var(--color-primary); }
  .label { color: var(--fg-1); font-weight: 600; }
  .val   { color: var(--fg-3); font-family: var(--font-family-mono); }
</style></head>
<body>
<div class="card">
  <div class="tile"><div class="box" style="border-radius:0"></div><span class="label">none</span><span class="val">0</span></div>
  <div class="tile"><div class="box" style="border-radius:4px"></div><span class="label">sm</span><span class="val">4 px</span></div>
  <div class="tile"><div class="box" style="border-radius:5px"></div><span class="label">md</span><span class="val">5 px</span></div>
  <div class="tile"><div class="box" style="border-radius:8px"></div><span class="label">lg</span><span class="val">8 px</span></div>
  <div class="tile"><div class="box" style="border-radius:12px"></div><span class="label">xl</span><span class="val">12 px</span></div>
</div>
</body></html>
