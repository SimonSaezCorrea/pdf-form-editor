<!doctype html>
<html lang="en"><head>
<meta charset="utf-8" />
<title>Geist — weight axis</title>
<link rel="stylesheet" href="_base.css" />
<style>
  .card { padding: 22px 26px; flex-direction: column; gap: 6px; }
  .row-item { display: grid; grid-template-columns: 80px 1fr 80px; align-items: baseline; gap: 16px; }
  .row-item .label { color: var(--fg-3); font-family: var(--font-family-mono); font-size: 11px; }
  .row-item .meta  { color: var(--fg-3); font-family: var(--font-family-mono); font-size: 11px; text-align: right; }
  .row-item .demo  { color: var(--fg-1); font-size: 22px; font-family: 'Geist', sans-serif; letter-spacing: -0.01em; }
  .head { font-size: 11px; color: var(--fg-3); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; margin-bottom: 4px; }
</style></head>
<body>
<div class="card">
  <div class="head">Geist · variable wght 100–900</div>
  <div class="row-item"><span class="label">100</span><span class="demo" style="font-weight:100">Editor de plantilla</span><span class="meta">Thin</span></div>
  <div class="row-item"><span class="label">300</span><span class="demo" style="font-weight:300">Editor de plantilla</span><span class="meta">Light</span></div>
  <div class="row-item"><span class="label">400</span><span class="demo" style="font-weight:400">Editor de plantilla</span><span class="meta">Regular</span></div>
  <div class="row-item"><span class="label">500</span><span class="demo" style="font-weight:500">Editor de plantilla</span><span class="meta">Medium</span></div>
  <div class="row-item"><span class="label">600</span><span class="demo" style="font-weight:600">Editor de plantilla</span><span class="meta">Semibold</span></div>
  <div class="row-item"><span class="label">700</span><span class="demo" style="font-weight:700">Editor de plantilla</span><span class="meta">Bold</span></div>
  <div class="row-item"><span class="label">900</span><span class="demo" style="font-weight:900">Editor de plantilla</span><span class="meta">Black</span></div>
</div>
</body></html>
