<!doctype html>
<html lang="en"><head>
<meta charset="utf-8" />
<title>Brand Colors</title>
<link rel="stylesheet" href="_base.css" />
<style>
  .card { padding: 20px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; align-items: stretch; }
</style></head>
<body>
<div class="card">
  <div class="swatch">
    <div class="swatch__chip" style="background:#07575B"></div>
    <div class="swatch__name">Primary · Brand</div>
    <div class="swatch__hex">#07575B</div>
  </div>
  <div class="swatch">
    <div class="swatch__chip" style="background:#66A5AD"></div>
    <div class="swatch__name">Primary · Dark mode</div>
    <div class="swatch__hex">#66A5AD</div>
  </div>
  <div class="swatch">
    <div class="swatch__chip" style="background:#E76F51"></div>
    <div class="swatch__name">Accent · Clay</div>
    <div class="swatch__hex">#E76F51</div>
  </div>
  <div class="swatch">
    <div class="swatch__chip" style="background:#F4A261"></div>
    <div class="swatch__name">Accent · Dark mode</div>
    <div class="swatch__hex">#F4A261</div>
  </div>
</div>
</body></html>
