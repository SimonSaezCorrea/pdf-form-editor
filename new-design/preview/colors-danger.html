<!doctype html>
<html lang="en"><head>
<meta charset="utf-8" />
<title>Danger Colors</title>
<link rel="stylesheet" href="_base.css" />
<style>
  .card { padding: 20px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
</style></head>
<body>
<div class="card">
  <div class="swatch"><div class="swatch__chip" style="background:#dc2626"></div><div class="swatch__name">danger</div><div class="swatch__hex">#DC2626</div></div>
  <div class="swatch"><div class="swatch__chip" style="background:#b91c1c"></div><div class="swatch__name">danger · hover</div><div class="swatch__hex">#B91C1C</div></div>
  <div class="swatch"><div class="swatch__chip" style="background:#3b0f0f"></div><div class="swatch__name">danger · bg dark</div><div class="swatch__hex">#3B0F0F</div></div>
  <div class="swatch"><div class="swatch__chip" style="background:#7f1d1d"></div><div class="swatch__name">danger · border dark</div><div class="swatch__hex">#7F1D1D</div></div>
</div>
</body></html>
