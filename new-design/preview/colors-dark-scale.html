<!doctype html>
<html lang="en"><head>
<meta charset="utf-8" />
<title>Dark Scale</title>
<link rel="stylesheet" href="_base.css" />
<style>
  .card { padding: 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
</style></head>
<body>
<div class="card">
  <div class="swatch"><div class="swatch__chip" style="background:#003B46"></div><div class="swatch__name">dark-900</div><div class="swatch__hex">#003B46</div></div>
  <div class="swatch"><div class="swatch__chip" style="background:#07575B"></div><div class="swatch__name">dark-800</div><div class="swatch__hex">#07575B</div></div>
  <div class="swatch"><div class="swatch__chip" style="background:#0d6e75"></div><div class="swatch__name">dark-700</div><div class="swatch__hex">#0D6E75</div></div>
</div>
</body></html>
