<!doctype html>
<html lang="en"><head>
<meta charset="utf-8" />
<title>Neutral Scale</title>
<link rel="stylesheet" href="_base.css" />
<style>
  .card { padding: 20px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
</style></head>
<body>
<div class="card">
  <div class="swatch"><div class="swatch__chip" style="background:#d6eef2"></div><div class="swatch__name">neutral-100</div><div class="swatch__hex">#D6EEF2</div></div>
  <div class="swatch"><div class="swatch__chip" style="background:#b2d7de"></div><div class="swatch__name">neutral-200</div><div class="swatch__hex">#B2D7DE</div></div>
  <div class="swatch"><div class="swatch__chip" style="background:#8ec4cc"></div><div class="swatch__name">neutral-300</div><div class="swatch__hex">#8EC4CC</div></div>
  <div class="swatch"><div class="swatch__chip" style="background:#66A5AD"></div><div class="swatch__name">neutral-400</div><div class="swatch__hex">#66A5AD</div></div>
  <div class="swatch"><div class="swatch__chip" style="background:#3d7280"></div><div class="swatch__name">neutral-500</div><div class="swatch__hex">#3D7280</div></div>
  <div class="swatch"><div class="swatch__chip" style="background:#2a5a65"></div><div class="swatch__name">neutral-600</div><div class="swatch__hex">#2A5A65</div></div>
</div>
</body></html>
